apiVersion: v1
kind: Service
metadata:
  name: go-web-ip
  annotations:
    # Define o tipo de balanceador como rede (Layer 4) ou L7 (PROXY)
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
spec:
  selector:
    app: go-web-ip

  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

  type: LoadBalancer
