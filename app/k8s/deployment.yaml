apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-ip
  labels:
    app: go-web-ip
spec:
  replicas: 2

  selector:
    matchLabels:
      app: go-web-ip

  template:
    metadata:
      labels:
        app: go-web-ip

    spec:
      containers:
        - name: go-web-ip
          image: pedrofilhojp/app-githubaction:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
