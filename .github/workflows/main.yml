# Nome do workflow
name: primeira-pipeline
# Definindo a trigger
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite que seja executado manualmente

jobs:
  build:
    runs-on: ubuntu-latest     
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Realizar login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem (Apenas validação)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-githubaction:latest
          push: true # Garante que não envia nada ainda neste estágio


  deploy:
    runs-on: ubuntu-latest
    needs: build                                 # Garante que o deploy só roda após o teste terminar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurando o kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Comando do kubernetes
        run: kubectl get nodes