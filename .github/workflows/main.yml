# Nome do workflow
name: primeira-pipeline
# Definindo a trigger
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite que seja executado manualmente

jobs:
  primeiro-job:
    name: "Meu primeiro Job"
    runs-on: ubuntu-latest  # nome do Helm release
    steps:
      - name: "Acesso ao código"
        uses: actions/checkout@v4
      - name: "Primeira execução"
        run: |
          echo "Primeira execução no kind"
          echo "testes"
          pwd
          ls 
      - name: "Segunda execução [python]"
        run: |
          variavel="teste"
          print(variavel)
        shell: python
  segundo-job:
    steps:
      - name: "Execução shell"
        run: |
          echo "Primeira execução no kind"
          echo "testes"
          pwd
          ls 