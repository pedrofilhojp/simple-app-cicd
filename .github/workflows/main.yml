# Nome do workflow
name: primeira-pipeline
# Definindo a trigger
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite que seja executado manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build project
        run: echo "Compilando o projeto..."
      
      - run: sleep 5

  pushish:
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar testes e gerar relatório
        run: |
          echo "Testes passaram com sucesso!" > resultado-teste.txt
          echo "Data: $(date)" >> resultado-teste.txt
          ls 

      # Passo 1: Salva o arquivo nos servidores do GitHub
      - name: Upload do arquivo de teste
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes                # Nome do pacote do artefato
          path: resultado-teste.txt             # Caminho do arquivo que será copiado

  deploy:
    runs-on: ubuntu-latest
    needs: publish                                 # Garante que o deploy só roda após o teste terminar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurando o kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Comando do kubernetes
        run: kubectl get nodes